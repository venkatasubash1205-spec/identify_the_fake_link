services:
  - type: web
    name: identify-the-fake-links
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Optional: add GOOGLE_SAFE_BROWSING_KEY in the Render dashboard
